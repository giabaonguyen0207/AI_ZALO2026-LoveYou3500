[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datamate-agent"
version = "0.2.0"
description = "Offline modular monolith for DataMate: inspect, query, verify, answer"
requires-python = ">=3.11"
dependencies = ["openpyxl==3.1.5"]

[project.optional-dependencies]
llm = ["torch>=2.7,<3", "transformers>=5.15,<6", "accelerate>=1.10,<2", "safetensors>=0.8,<1", "huggingface-hub>=1.5,<2", "sentencepiece>=0.2,<1", "jinja2>=3.1,<4", "bitsandbytes>=0.48,<1"]
train = ["datamate-agent[llm]", "peft>=0.20,<1", "datasets>=4,<6", "bitsandbytes>=0.48,<1"]
dev = ["pytest>=8,<10"]
test-llm = ["transformers>=5.15,<6", "safetensors>=0.8,<1", "sentencepiece>=0.2,<1"]
# AsyncLLM V1 API target; candidate range, not a GPU-validated environment lock.
vllm = ["vllm>=0.33,<0.34", "bitsandbytes>=0.48,<1"]
rag = ["torch>=2.7,<3", "transformers>=5.15,<6", "safetensors>=0.8,<1", "huggingface-hub>=1.5,<2", "sentencepiece>=0.2,<1", "numpy>=1.26,<3"]

[project.scripts]
datamate = "datamate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
